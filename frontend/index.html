<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess rating calculator</title>
<style>
  :root {
    --bg: #eef0ec; --panel: #fbfbf8; --ink: #1d2a2a; --muted: #5d6b69;
    --line: #c9d0cb; --accent: #2f5d62; --accent-ink: #fff; --bad: #a43a2f; --good: #2d6a3e;
    --font: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }

@media (prefers-color-scheme: dark) {
:root {
--bg: #14201f; --panel: #1b2b2a; --ink: #e6ece8; --muted: #9fb0ac;
--line: #36504d; --accent: #8cc3c0; --accent-ink: #11201f;
--bad: #e08a7e; --good: #8fd1a0;
}
}

* { box-sizing: border-box; }

body {
margin: 0;
background: var(--bg);
color: var(--ink);
font: 17px/1.5 var(--font);
}

main {
max-width: 34rem;
margin: 0 auto;
padding: 2rem 1rem 4rem;
}

h1 {
font-size: 1.7rem;
margin: 0 0 .25rem;
}

.method-info {
  margin: 0 0 1rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: color-mix(in srgb, var(--panel) 70%, var(--bg));
  color: var(--muted);
}

.method-info summary {
  padding: .65rem .8rem;
  color: var(--ink);
  cursor: pointer;
  font-weight: 600;
  user-select: none;
}

.method-info summary::marker {
  color: var(--accent);
}

.method-info > div {
  padding: 0 .8rem .75rem;
}

.method-info p {
  margin: .75rem 0 0;
}

.method-info a {
  color: inherit;
}

[role=tablist] {
display: flex;
gap: .5rem;
margin-bottom: 1rem;
}

[role=tab] {
flex: 1;
padding: .55rem;
font: inherit;
color: var(--ink);
background: transparent;
border: 1px solid var(--line);
border-radius: 6px;
cursor: pointer;
}

[role=tab][aria-selected=true] {
background: var(--accent);
color: var(--accent-ink);
border-color: var(--accent);
}

form {
background: var(--panel);
border: 1px solid var(--line);
border-radius: 10px;
padding: 1.25rem;
display: grid;
gap: 1rem;
}

label {
display: grid;
gap: .25rem;
font-size: .95rem;
}

label small {
color: var(--muted);
}

input[type=text],
input[type=number],
select {
font: inherit;
padding: .5rem .6rem;
color: var(--ink);
background: var(--bg);
border: 1px solid var(--line);
border-radius: 6px;
width: 100%;
}

.advanced summary {
color: var(--muted);
cursor: pointer;
user-select: none;
}

button.go {
font: inherit;
padding: .65rem;
background: var(--accent);
color: var(--accent-ink);
border: 0;
border-radius: 6px;
cursor: pointer;
}

:focus-visible {
outline: 3px solid var(--accent);
outline-offset: 2px;
}

#result {
margin-top: 1.25rem;
min-height: 4rem;
}

.rating {
font-size: 3rem;
line-height: 1.1;
}

.error {
color: var(--bad);
white-space: pre-wrap;
} </style>

</head>

<body>
<main>
  <h1>Elochess</h1>

  <div role="tablist" id="tabs"></div>

  <details class="method-info">
    <summary>About</summary>
    <div id="lead"></div>
  </details>

  <form id="form" novalidate></form>
  <div id="result" aria-live="polite"></div>
</main>

<script>
  const API_BASE = "";

  const COMMON = [
    {
      key: "current_rating",
      label: "Current rating",
      type: "number",
      min: 0,
      default: 1500,
      required: true
    },
    {
      key: "opponent_ratings",
      label: "Opponent ratings",
      type: "list",
      required: true,
      hint: "Comma-separated, e.g. 1850, 1920, 2010"
    },
    {
      key: "score",
      label: "Total score",
      type: "number",
      min: 0,
      step: 0.5,
      required: true,
      hint: "Points earned across all games (win 1, draw 0.5, loss 0)"
    },
  ];

  const SYSTEMS = {
    elo: {
      label: "FIDE",
      description: `
        <p>
          The calculation is performed according to the rules effective from
          March 1st 2024, see
          <a href="https://handbook.fide.com/chapter/B022024"
             target="_blank"
             rel="noopener noreferrer">
             FIDE handbook
          </a>.
        </p>
      `,
      extra: [
        {
          key: "birth_year",
          label: "Birth year",
          min: 1900,
          max: new Date().getFullYear(),
          default: new Date().getFullYear() - 19,
          type: "number",
          hint: `Only born ${new Date().getFullYear() - 18} or later vs. before ${new Date().getFullYear() - 18} matters, unless an evaluation year is specified.`
        },
        {
          key: "evaluation_year",
          label: "Evaluation year",
          type: "number",
          advanced: true,
          min: 1900,
          max: new Date().getFullYear(),
          default: new Date().getFullYear()
        },
        {
          key: "games_played",
          label: "Games played so far",
          type: "number",
          min: 0,
          default: 30,
          hint: "30 or more games are treated the same."
        },
        {
          key: "reached_2400",
          label: "Has reached 2400",
          type: "bool",
          advanced: true
        },
      ]
    },

    dwz: {
      label: "DWZ",
      description: `
        <p>
          The calculation is performed according to the rules that went into
          effect on the 8th of June, see
          <a href="https://www.schachbund.de/wertungsordnung.html"
             target="_blank"
             rel="noopener noreferrer">
             Deutscher Schachbund
          </a>.
        </p>
      `,
      extra: [
        {
          key: "age",
          label: "Age",
          type: "select",
          options: [
            { value: 20, label: "Up to 20" },
            { value: 21, label: "21–25" },
            { value: 26, label: "26 or older" }
          ],
          default: 26
        },
        {
          key: "index",
          label: "Index",
          type: "select",
          options: [
            { value: 0, label: "0" },
            { value: 1, label: "1" },
            { value: 2, label: "2" },
            { value: 3, label: "3" },
            { value: 4, label: "4" },
            { value: 5, label: "5" },
            { value: 6, label: "6" },
            { value: 7, label: "7" },
            { value: 8, label: "8" },
            { value: 9, label: "9" },
            { value: 10, label: "10" },
            { value: 11, label: "11 or more" }
          ],
          default: 11
        }
      ]
    },

    uscf: {
      label: "USCF",
      description: `
        <p>
          The calculated ratings are an estimate based on the "official"
          <a href="https://www.uschess.org/ratings-and-pairings/ratings-faq"
             target="_blank"
             rel="noopener noreferrer">
            Rating Estimator
          </a>.
        </p>

        <p>
          Keep in mind that this is a mere estimate of the real calculation
          which can only be performed by knowing all results of all players.
        </p>
      `,
      extra: [
        {
          key: "games_played",
          label: "Games played so far",
          min: 0,
          type: "number"
        },
        {
          key: "is_dual_rated",
          label: "Dual rated",
          type: "bool",
          advanced: true
        },
      ]
    },
  };

  const tabs = document.getElementById("tabs");
  const form = document.getElementById("form");
  const result = document.getElementById("result");
  const lead = document.getElementById("lead");

  let current = "elo";

  function renderField(f) {
    const l = document.createElement("label");

    if (f.type === "bool") {
      l.className = "check";

      l.innerHTML =
        `<input type="checkbox" name="${f.key}"> ${f.label}`;
    }

    else if (f.type === "select") {
      const options = f.options
        .map(o => `<option value="${o.value}">
          ${o.label}
        </option>`)
        .join("");

      l.innerHTML =
        `${f.label}<select name="${f.key}">${options}</select>` +
        (f.hint ? `<small>${f.hint}</small>` : "");
    }

    else {
      const t = f.type === "list" ? "text" : "number";

      const attributes = [];

      if (f.required) {
        attributes.push("required");
      }

      if (t === "number") {
        attributes.push(`step="${f.step ?? "any"}"`);
      }

      if (f.min !== undefined) {
        attributes.push(`min="${f.min}"`);
      }

      if (f.max !== undefined) {
        attributes.push(`max="${f.max}"`);
      }

      l.innerHTML =
        `${f.label}<input type="${t}" name="${f.key}"
         ${attributes.join(" ")}>` +
        (f.hint ? `<small>${f.hint}</small>` : "");
    }

    return l;
  }

  function render() {
    lead.innerHTML = SYSTEMS[current].description;

    tabs.innerHTML = "";

    for (const [id, s] of Object.entries(SYSTEMS)) {
      const b = document.createElement("button");

      b.type = "button";
      b.role = "tab";
      b.textContent = s.label;
      b.setAttribute("aria-selected", id === current);

      b.onclick = () => {
        current = id;
        result.innerHTML = "";
        render();
      };

      tabs.append(b);
    }

    form.innerHTML = "";

    const fields = [...COMMON, ...SYSTEMS[current].extra];
    const advancedFields = fields.filter(f => f.advanced && !f.hidden);

    for (const f of fields) {
      if (f.hidden || f.advanced) continue;

      form.append(renderField(f));
    }

    if (advancedFields.length > 0) {
      const details = document.createElement("details");
      details.className = "advanced";

      const summary = document.createElement("summary");
      summary.textContent = "More options";

      const container = document.createElement("div");
      container.className = "advanced-fields";

      for (const f of advancedFields) {
        container.append(renderField(f));
      }

      details.append(summary, container);
      form.append(details);
    }

    form.insertAdjacentHTML(
      "beforeend",
      '<button class="go" type="submit">Calculate rating</button>'
    );

    for (const f of SYSTEMS[current].extra) {
      if (f.default === undefined || f.hidden) continue;

      const el = form.elements[f.key];

      if (f.type === "select" || f.type === "number") {
        el.value = String(f.default);
      }
    }
  }

  function buildPayload() {
    const payload = {};

    for (const f of [...COMMON, ...SYSTEMS[current].extra]) {
      const el = form.elements[f.key];

      if (f.hidden) continue;

      if (f.type === "bool") {
        payload[f.key] = el.checked;
        continue;
      }

      const v = el.value.trim();

      if (v === "") continue;

      if (f.type === "list") {
        payload[f.key] = v
          .split(/[,\s;]+/)
          .filter(Boolean)
          .map(Number);
      }

      else {
        payload[f.key] = Number(v);
      }
    }

    if (current === "dwz") {
      if (payload.index !== undefined) {
        payload.index = payload.index > 10 ? 11 : payload.index;
      }
    }

    if (current === "uscf") {
      if (payload.games_played !== undefined) {
        payload.games_played = Math.max(
          0,
          Math.min(payload.games_played, 30)
        );
      }
    }

    return payload;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    const payload = buildPayload();

    result.textContent = "Calculating…";

    try {
      const res = await fetch(`${API_BASE}/update/${current}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload),
      });

      const data = await res.json();

      if (!res.ok) {
        const detail = Array.isArray(data.detail)
          ? data.detail
              .map(d => `${d.loc.slice(1).join(".")}: ${d.msg}`)
              .join("\n")
          : (data.detail || res.statusText);

        result.innerHTML = `<div class="error"></div>`;
        result.firstChild.textContent = detail;
        return;
      }

      const diff = data.rating - payload.current_rating;
      const sign = diff > 0 ? "+" : "";

      result.innerHTML = `
        <div class="rating">${data.rating}</div>
        <div class="delta ${diff >= 0 ? "up" : "down"}">
          ${sign}${Math.round(diff * 100) / 100}
          from ${payload.current_rating}
        </div>
      `;
    }

    catch (err) {
      result.innerHTML =
        `<div class="error">
          Could not reach the API. Check that the server is running.
        </div>`;
    }
  });

  render();
</script>

</body>
</html>
