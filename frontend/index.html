<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elochess</title>

<style>
  :root {
    --bg: #eef0ec;
    --panel: #fbfbf8;
    --ink: #1d2a2a;
    --muted: #5d6b69;
    --line: #c9d0cb;
    --accent: #2f5d62;
    --accent-ink: #fff;
    --bad: #a43a2f;
    --good: #2d6a3e;
    --font: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14201f;
      --panel: #1b2b2a;
      --ink: #e6ece8;
      --muted: #9fb0ac;
      --line: #36504d;
      --accent: #8cc3c0;
      --accent-ink: #11201f;
      --bad: #e08a7e;
      --good: #8fd1a0;
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.5 var(--font);
  }

  main {
    max-width: 30rem;
    margin: 0 auto;
    padding: 2rem 1rem 4rem;
  }

  .intro {
    margin-bottom: 1rem;
    text-align: center;
  }

  .intro p {
    margin: .5rem 0 0;
    color: var(--muted);
    font-size: .95rem;
  }

  [role=tablist] {
    display: flex;
    gap: .5rem;
    margin-bottom: 1rem;
  }

  .tab {
    position: relative;
    flex: 1;
  }

  [role=tab] {
    width: 100%;
    padding: .55rem 1.75rem .55rem .55rem;
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  [role=tab][aria-selected=true] {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  .tab-info {
    position: absolute;
    top: 50%;
    right: .45rem;
    transform: translateY(-50%);
    width: 1.4rem;
    height: 1.4rem;
    padding: 0;
    border: 0;
    border-radius: 50%;
    font: bold .8rem/1 var(--font);
    cursor: pointer;
    color: var(--muted);
    background: color-mix(in srgb, var(--panel) 75%, transparent);
  }

  [role=tab][aria-selected=true] + .tab-info {
    color: var(--accent);
    background: var(--accent-ink);
  }

  .tab-info:hover {
    opacity: .8;
  }

  .tab-description {
    display: none;
    position: absolute;
    z-index: 10;
    top: calc(100% + .5rem);
    left: 0;
    right: 0;
    padding: .75rem .85rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .12);
    font-size: .9rem;
    text-align: left;
  }

  .tab-description.open {
    display: block;
  }

  .tab-description::before {
    content: "";
    position: absolute;
    top: -.4rem;
    left: 50%;
    width: .7rem;
    height: .7rem;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-top: 1px solid var(--line);
    transform: translateX(-50%) rotate(45deg);
  }

  .tab-description p {
    margin: 0;
  }

  .tab-description p + p {
    margin-top: .65rem;
  }

  .tab-description a {
    color: inherit;
  }

  form {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    display: grid;
    gap: 0.5rem;
  }

  label {
    display: grid;
    gap: .25rem;
    font-size: .95rem;
  }

  label small {
    color: var(--muted);
  }

  .bool-field {
    display: grid;
    gap: .25rem;
    font-size: .95rem;
  }

  .field-label {
    display: block;
  }

  .switch {
    display: flex;
    align-items: center;
    width: 3rem;
    height: 1.6rem;
    padding: 0;
    cursor: pointer;
  }

  .switch input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .slider {
    position: relative;
    width: 3rem;
    height: 1.6rem;
    background: var(--line);
    border-radius: 999px;
    transition: background .15s ease;
  }

  .slider::before {
    content: "";
    position: absolute;
    width: 1.2rem;
    height: 1.2rem;
    left: .2rem;
    top: .2rem;
    border-radius: 50%;
    background: var(--panel);
    transition: transform .15s ease;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
  }

  .switch input:checked + .slider {
    background: var(--accent);
  }

  .switch input:checked + .slider::before {
    transform: translateX(1.4rem);
  }

  .advanced-fields {
    display: grid;
    gap: 1rem;
    margin-top: 1rem;
  }

  input[type=text],
  input[type=number],
  select {
    font: inherit;
    height: 2.25rem;
    padding: .5rem .6rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    width: 100%;
  }

  .advanced summary {
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }

  button.go {
    font: inherit;
    padding: .65rem;
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }

  :focus-visible {
    outline: 3px solid var(--accent);
  }

  #result {
    margin-top: 1rem;
  }

  .result-card {
    min-height: 7rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .6rem;
    padding: 0.5rem 1.25rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-align: center;
    transition: background .2s ease, border-color .2s ease;
  }

  .result-card.empty {
    background: transparent;
    border-style: dashed;
  }

  .result-card.empty .result-new {
    color: var(--line);
  }

  .result-card.loading {
    opacity: .6;
  }

  .result-label {
    font-size: .75rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .result-new {
    font-size: 3.5rem;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .result-meta {
    display: flex;
    align-items: center;
    gap: .6rem;
    color: var(--muted);
    font-size: .95rem;
    font-variant-numeric: tabular-nums;
  }

  .pill {
    padding: .15rem .65rem;
    border-radius: 999px;
    font-weight: bold;
    background: color-mix(in srgb, currentColor 14%, transparent);
  }

  .pill.up   { color: var(--good); }
  .pill.down { color: var(--bad); }
  .pill.flat { color: var(--muted); }

  .result-message {
    color: var(--muted);
    font-size: .95rem;
  }

  .result-card.error {
    border-color: var(--bad);
  }

  .result-card.error .result-message {
    color: var(--bad);
    white-space: pre-wrap;
  }

  .result-card.done .result-new,
  .result-card.done .result-meta {
    animation: rise .35s ease both;
  }

  .result-card.done .result-meta {
    animation-delay: .08s;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .result-card.done .result-new,
    .result-card.done .result-meta {
      animation: none;
    }
  }
</style>
</head>

<body>
<main>
  <header class="intro">
    <p>
      Calculate rating changes across FIDE, DWZ, and USCF systems.
    </p>
  </header>

  <div role="tablist" id="tabs"></div>

  <form id="form" novalidate></form>

  <div id="result" aria-live="polite"></div>
</main>

<script>
  const API_BASE = "";

  const COMMON = [
    {
      key: "current_rating",
      label: "Current rating",
      type: "number",
      min: 0,
      required: true
    },
    {
      key: "opponent_ratings",
      label: "Opponent ratings",
      type: "list",
      required: true,
      hint: "Comma-separated, e.g. 1850, 1920, 2010"
    },
    {
      key: "score",
      label: "Total score",
      type: "number",
      min: 0,
      step: 0.5,
      required: true
    }
  ];

  const SYSTEMS = {
    elo: {
      label: "FIDE",
      description: `
        <p>
          The calculation is performed according to the rules effective from
          March 1st 2024, see
          <a href="https://handbook.fide.com/chapter/B022024"
             target="_blank"
             rel="noopener noreferrer">
             FIDE handbook
          </a>.
        </p>
      `,
      extra: [
        {
          key: "birth_year",
          label: "Birth year",
          min: 1900,
          max: new Date().getFullYear(),
          default: new Date().getFullYear() - 19,
          type: "number",
          hint: `Only born ${new Date().getFullYear() - 18} or later vs. before ${new Date().getFullYear() - 18} matters.`
        },
        {
          key: "evaluation_year",
          label: "Evaluation year",
          type: "number",
          advanced: true,
          min: 1900,
          max: new Date().getFullYear(),
          default: new Date().getFullYear()
        },
        {
          key: "games_played",
          label: "Games played so far",
          type: "number",
          min: 0,
          default: 30,
          hint: "30 or more games are treated the same."
        },
        {
          key: "reached_2400",
          label: "Has reached 2400",
          type: "bool",
          advanced: true,
          default: false
        }
      ]
    },

    dwz: {
      label: "DWZ",
      description: `
        <p>
          The calculation is performed according to the rules that went into
          effect on the 8th of June 2026, see
          <a href="https://www.schachbund.de/wertungsordnung.html"
             target="_blank"
             rel="noopener noreferrer">
             Deutscher Schachbund
          </a>.
        </p>
      `,
      extra: [
        {
          key: "age",
          label: "Age",
          type: "select",
          options: [
            { value: 20, label: "Up to 20" },
            { value: 21, label: "21–25" },
            { value: 26, label: "26 or older" }
          ],
          default: 26
        },
        {
          key: "index",
          label: "Index",
          type: "select",
          options: [
            { value: 0, label: "0" },
            { value: 1, label: "1" },
            { value: 2, label: "2" },
            { value: 3, label: "3" },
            { value: 4, label: "4" },
            { value: 5, label: "5" },
            { value: 6, label: "6" },
            { value: 7, label: "7" },
            { value: 8, label: "8" },
            { value: 9, label: "9" },
            { value: 10, label: "10" },
            { value: 11, label: "11 or more" }
          ],
          default: 11,
          hint: "The number of previous evaluations."
        }
      ]
    },

    uscf: {
      label: "USCF",
      description: `
        <p>
          The calculated ratings are an estimate based on the "official"
          <a href="https://www.uschess.org/ratings-and-pairings/ratings-faq"
             target="_blank"
             rel="noopener noreferrer">
            Rating Estimator
          </a>.
        </p>

        <p>
          Keep in mind that this is a mere estimate of the real calculation
          which can only be performed by knowing all results of all players.
        </p>
      `,
      extra: [
        {
          key: "games_played",
          label: "Games played so far",
          min: 0,
          default: 0,
          type: "number"
        },
        {
          key: "is_dual_rated",
          label: "Dual rated",
          type: "bool",
          advanced: true,
          default: false
        }
      ]
    }
  };

  const tabs = document.getElementById("tabs");
  const form = document.getElementById("form");
  const result = document.getElementById("result");

  let current = "elo";

  function renderField(f) {
    const l = document.createElement("label");

    if (f.type === "bool") {
      l.className = "bool-field";

      const labelText = document.createElement("span");
      labelText.className = "field-label";
      labelText.textContent = f.label;

      const control = document.createElement("label");
      control.className = "switch";

      const input = document.createElement("input");
      input.type = "checkbox";
      input.name = f.key;

      if (f.default === true) {
        input.checked = true;
      }

      const slider = document.createElement("span");
      slider.className = "slider";

      control.append(input, slider);
      l.append(labelText, control);
    }

    else if (f.type === "select") {
      const labelText = document.createTextNode(f.label);

      const select = document.createElement("select");
      select.name = f.key;

      for (const option of f.options) {
        const optionElement = document.createElement("option");
        optionElement.value = String(option.value);
        optionElement.textContent = option.label;
        select.append(optionElement);
      }

      if (f.default !== undefined) {
        select.value = String(f.default);
      }

      l.append(labelText, select);

      if (f.hint) {
        const hint = document.createElement("small");
        hint.textContent = f.hint;
        l.append(hint);
      }
    }

    else {
      const input = document.createElement("input");

      input.type = f.type === "list" ? "text" : "number";
      input.name = f.key;

      if (f.required) {
        input.required = true;
      }

      if (f.type !== "list") {
        input.step = String(f.step ?? "any");
      }

      if (f.min !== undefined) {
        input.min = String(f.min);
      }

      if (f.max !== undefined) {
        input.max = String(f.max);
      }

      if (f.default !== undefined) {
        input.value = String(f.default);
      }

      l.append(document.createTextNode(f.label), input);

      if (f.hint) {
        const hint = document.createElement("small");
        hint.textContent = f.hint;
        l.append(hint);
      }
    }

    return l;
  }

  function closeDescriptions(except = null) {
    document.querySelectorAll(".tab-description.open").forEach(description => {
      if (description !== except) {
        description.classList.remove("open");
      }
    });
  }

  function render() {
    const system = SYSTEMS[current];

    tabs.innerHTML = "";

    for (const [id, s] of Object.entries(SYSTEMS)) {
      const wrapper = document.createElement("div");
      wrapper.className = "tab";

      const b = document.createElement("button");

      b.type = "button";
      b.setAttribute("role", "tab");
      b.textContent = s.label;
      b.setAttribute("aria-selected", String(id === current));
      b.tabIndex = id === current ? 0 : -1;

      b.addEventListener("click", () => {
        if (current === id) {
          return;
        }

        current = id;
        closeDescriptions();
        render();
        showResult("empty");
      });

      const info = document.createElement("button");

      info.type = "button";
      info.className = "tab-info";
      info.textContent = "i";
      info.setAttribute("aria-label", `About ${s.label}`);
      info.setAttribute("aria-expanded", "false");

      const description = document.createElement("div");
      description.className = "tab-description";
      description.innerHTML = s.description;

      info.addEventListener("click", (e) => {
        e.stopPropagation();

        const isOpen = description.classList.contains("open");

        closeDescriptions(description);

        description.classList.toggle("open", !isOpen);
        info.setAttribute("aria-expanded", String(!isOpen));
      });

      wrapper.append(b, info, description);
      tabs.append(wrapper);
    }

    form.innerHTML = "";

    const fields = [...COMMON, ...system.extra];

    const advancedFields = fields.filter(
      f => f.advanced && !f.hidden
    );

    for (const f of fields) {
      if (f.hidden || f.advanced) {
        continue;
      }

      form.append(renderField(f));
    }

    if (advancedFields.length > 0) {
      const details = document.createElement("details");
      details.className = "advanced";

      const summary = document.createElement("summary");
      summary.textContent = "More options";

      const container = document.createElement("div");
      container.className = "advanced-fields";

      for (const f of advancedFields) {
        container.append(renderField(f));
      }

      details.append(summary, container);
      form.append(details);
    }

    const submit = document.createElement("button");
    submit.className = "go";
    submit.type = "submit";
    submit.textContent = "Calculate rating";

    form.append(submit);
  }

  function showResult(state, data = {}) {
    const card = document.createElement("div");
    card.className = `result-card ${state}`;

    if (state === "done") {
      const big = document.createElement("div");
      big.className = "result-new";
      big.textContent = data.rating;

      const meta = document.createElement("div");
      meta.className = "result-meta";

      const rounded = Math.round(data.diff * 100) / 100;
      const kind = rounded > 0 ? "up" : rounded < 0 ? "down" : "flat";
      const arrow = rounded > 0 ? "▲" : rounded < 0 ? "▼" : "•";
      const sign = rounded > 0 ? "+" : rounded < 0 ? "−" : "±";

      const pill = document.createElement("span");
      pill.className = `pill ${kind}`;
      pill.textContent = `${arrow} ${sign}${Math.abs(rounded)}`;

      const from = document.createElement("span");
      from.textContent = `from ${data.old}`;

      meta.append(pill, from);
      card.append(big, meta);
    }

    else if (state === "error") {
      const msg = document.createElement("div");
      msg.className = "result-message";
      msg.textContent = data.message;

      card.append(msg);
    }

    else {
      const big = document.createElement("div");
      big.className = "result-new";
      big.textContent = "—";

      const msg = document.createElement("div");
      msg.className = "result-message";
      msg.textContent = state === "loading"
        ? "Calculating…"
        : "Your result will appear here";

      card.append(big, msg);
    }

    result.replaceChildren(card);
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".tab")) {
      closeDescriptions();
    }
  });

  function getFieldElement(key) {
    return form.elements.namedItem(key);
  }

  function buildPayload() {
    const payload = {};

    for (const f of [...COMMON, ...SYSTEMS[current].extra]) {
      if (f.hidden) {
        continue;
      }

      const el = getFieldElement(f.key);

      if (!el) {
        throw new Error(`Missing form field: ${f.key}`);
      }

      if (f.type === "bool") {
        payload[f.key] = el.checked;
        continue;
      }

      const rawValue = el.value.trim();

      if (rawValue === "") {
        continue;
      }

      if (f.type === "list") {
        const values = rawValue
          .split(/[,\s;]+/)
          .filter(Boolean)
          .map(Number);

        if (
          values.length === 0 ||
          values.some(value => !Number.isFinite(value))
        ) {
          throw new Error(
            `${f.label} must contain only numbers separated by commas, spaces, or semicolons.`
          );
        }

        payload[f.key] = values;
      }

      else {
        const value = Number(rawValue);

        if (!Number.isFinite(value)) {
          throw new Error(`${f.label} must be a valid number.`);
        }

        payload[f.key] = value;
      }
    }

    if (current === "dwz" && payload.index !== undefined) {
      payload.index = Math.min(payload.index, 11);
    }

    if (current === "uscf" && payload.games_played !== undefined) {
      payload.games_played = Math.max(
        0,
        Math.min(payload.games_played, 30)
      );
    }

    return payload;
  }

  async function readApiResponse(res) {
    const contentType = res.headers.get("content-type") || "";

    if (contentType.includes("application/json")) {
      return await res.json();
    }

    const text = await res.text();

    return {
      detail: text || res.statusText || "The server returned an empty response."
    };
  }

  function formatApiError(data, fallback) {
    if (Array.isArray(data?.detail)) {
      return data.detail
        .map(d => {
          const location = Array.isArray(d?.loc)
            ? d.loc.slice(1).join(".")
            : "";

          const message = d?.msg || "Invalid value.";

          return location
            ? `${location}: ${message}`
            : message;
        })
        .join("\n");
    }

    if (typeof data?.detail === "string") {
      return data.detail;
    }

    return fallback;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    let payload;

    try {
      payload = buildPayload();
    }

    catch (err) {
      showResult("error", {
        message: err instanceof Error ? err.message : "Invalid input."
      });
      return;
    }

    showResult("loading");

    try {
      const res = await fetch(`${API_BASE}/update/${current}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify(payload)
      });

      const data = await readApiResponse(res);

      if (!res.ok) {
        showResult("error", {
          message: formatApiError(data, res.statusText || "The calculation failed.")
        });
        return;
      }

      const rating = Number(data?.rating);

      if (!Number.isFinite(rating)) {
        throw new Error("The API returned an invalid rating.");
      }

      const currentRating = Number(payload.current_rating);

      if (!Number.isFinite(currentRating)) {
        throw new Error("The current rating is invalid.");
      }

      const diff = rating - currentRating;

      showResult("done", { old: currentRating, rating, diff });
    }

    catch (err) {
      showResult("error", {
        message: err instanceof TypeError
          ? "Could not reach the API. Check that the server is running."
          : (err instanceof Error ? err.message : "Something went wrong while calculating the rating.")
      });
    }
  });

  render();
  showResult("empty");
</script>

</body>
</html>
